[project]
name = "moon-tracker"
version = "0.1.0"
description = "Track Me to the Moon - simple Apploye-like team work tracker (time + screenshots + app titles)"
requires-python = ">=3.10"
dependencies = [
  "flet==1.0.1",
  "mss",
  "Pillow",
  "PyWinCtl",
  "psutil",
  "pystray",
  "pynput",
  "requests",
]

[project.scripts]
moon-tracker = "moon_tracker.app:main"
worktracker = "moon_tracker.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
